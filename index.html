<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f3f7f0">
  <title>图论与魔方</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="vendor/three.min.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header class="titlebar">
    <div><h1>图论与魔方</h1><p>三维立方体表面二维化</p></div>
    <button id="reset" class="quiet-button" type="button">重置</button>
  </header>

  <main class="demo" aria-label="图论与魔方交互演示">
    <section class="graph-panel" aria-label="三组三重圆环图">
      <svg id="ring" viewBox="0 0 640 570" role="img" aria-label="三组三重圆环形成五十四个固定交点。拖动外层圆线可旋转对应魔方面。">
        <defs><filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity=".15"/></filter></defs>
        <g id="ring-lines"></g><g id="nodes"></g><g id="moving-nodes"></g><g id="ring-hits"></g>
      </svg>
      <div id="graph-state" class="graph-state" aria-live="polite">U · 上层</div>
      <p class="graph-hint">拖动圆环，颜色沿环流动</p>
    </section>

    <div class="controls" aria-label="旋转控制">
      <label class="visually-hidden" for="layer">选择旋转面</label>
      <select id="layer" aria-label="选择旋转面">
        <option value="U">U · 上层</option><option value="R">R · 右层</option><option value="F">F · 前层</option>
        <option value="D">D · 下层</option><option value="L">L · 左层</option><option value="B">B · 后层</option>
      </select>
      <button id="ccw" class="turn-button" type="button"><span>↶</span> 逆时针</button>
      <button id="cw" class="turn-button primary" type="button"><span>↷</span> 顺时针</button>
    </div>

    <section id="cube-stage" aria-label="三维魔方">
      <div id="loading">正在准备三维魔方…</div>
      <div class="canvas-badge"><i id="face-dot"></i><span id="face-label">U · 上层</span></div>
      <button id="view-reset" class="view-button" type="button">恢复视角</button>
      <p class="cube-hint">拖动查看 · 点击任意面旋转</p>
      <div class="move-status"><span id="status" role="status">已还原 · 准备开始探索</span><span><b id="move-count">00</b> 步 · <b id="last-move">—</b></span></div>
    </section>
  </main>
</body>
</html>
